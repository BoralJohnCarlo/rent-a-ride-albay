<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer and public mobile before and after</title>
<style>body{font:16px system-ui;background:#f1f5f9;color:#172554;margin:0;padding:24px}main{max-width:900px;margin:auto}section{margin:32px 0}h1{font-size:28px}p{line-height:1.5} .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}figure{margin:0}figcaption{font-weight:700;margin-bottom:10px}img{width:100%;max-width:375px;border:1px solid #cbd5e1;border-radius:12px;background:white}@media(max-width:480px){body{padding:12px}.pair{gap:10px}}</style>
<main><h1>Customer and public mobile improvements</h1><p>iPhone SE viewport, 375 × 667. Real components with isolated sample data. <a href="README.md">Audit scope and limitations</a>.</p><div id="comparisons"></div></main>
<script>for(const [file,title] of [["customer-Bookings","Customer bookings"],["customer-Checkout","Checkout"],["customer-CustomerService","Customer service"],["public-Register","Customer signup"],["public-RegisterOperator","Partner signup"],["public-Contact","Contact"]]){const section=document.createElement('section');const heading=document.createElement('h2');heading.textContent=title;section.append(heading);const pair=document.createElement('div');pair.className='pair';for(const phase of ['before','after']){const figure=document.createElement('figure');const caption=document.createElement('figcaption');caption.textContent=phase==='before'?'Before':'After';const img=document.createElement('img');img.src=`${phase}/${file}-iPhone-SE-portrait.png`;img.alt=`${title} ${phase}, iPhone SE`;img.loading='lazy';figure.append(caption,img);pair.append(figure)}section.append(pair);document.getElementById('comparisons').append(section)}</script></html>
